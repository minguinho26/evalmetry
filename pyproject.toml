[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evalmetry"
version = "1.1.1"
description = "A research toolkit for measuring and analyzing model behavior."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["lm-eval", "language-models", "evaluation", "interpretability"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Import lm_eval from the active Python environment, including editable installs.
# These two versions are the reviewed default pair. Extras can add requirements,
# but cannot replace these pins with another lm-eval / transformers combination.
dependencies = [
    "lm-eval[hf]==0.4.13",
    "torch>=2.1",
    "transformers==5.16.1",
    "pyarrow>=14",
    "pandas>=2.0",
    "safetensors>=0.4",
    "matplotlib>=3.7",
    # Needed by models whose tokenizers must be converted from SentencePiece.
    "sentencepiece",
    "protobuf",
    "pyyaml",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/minguinho26/evalmetry"
Repository = "https://github.com/minguinho26/evalmetry"
Issues = "https://github.com/minguinho26/evalmetry/issues"
Releases = "https://github.com/minguinho26/evalmetry/releases"

[project.optional-dependencies]
# Retain the existing name for the default pair with pinned reporting libraries.
# torch stays unpinned so a compatible CUDA build already installed is preserved.
pinned-latest = [
    "lm-eval==0.4.13",
    "transformers==5.16.1",
    "accelerate",
    "pyarrow==25.0.1",
    "pandas==3.0.5",
    "safetensors==0.8.0",
    "matplotlib==3.11.1",
    "sentencepiece",
    "protobuf",
]
[project.scripts]
evalmetry = "evalmetry.main:main"

[tool.setuptools]
packages = ["evalmetry"]
