name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match package version'
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify installed wheel outside the checkout
        run: |
          python -m venv /tmp/evalmetry-smoke
          /tmp/evalmetry-smoke/bin/python -m pip install dist/*.whl
          /tmp/evalmetry-smoke/bin/python -m pip check
          cd /tmp
          /tmp/evalmetry-smoke/bin/python -I - <<'PY'
          import importlib
          import pkgutil
          import evalmetry

          # Import every shipped module to catch missing runtime dependencies.
          for module in pkgutil.iter_modules(evalmetry.__path__, 'evalmetry.'):
              importlib.import_module(module.name)
          assert callable(evalmetry.run)
          PY
          /tmp/evalmetry-smoke/bin/evalmetry --help
          /tmp/evalmetry-smoke/bin/evalmetry run --help
          /tmp/evalmetry-smoke/bin/evalmetry report --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/evalmetry/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
